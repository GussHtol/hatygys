<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная</title>
<style>body{font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:#0f2a33;color:#eaf3ee;text-align:center}
button{margin-top:16px;padding:10px 22px;border:0;border-radius:10px;background:#a0d7e1;font:inherit;cursor:pointer}</style></head>
<body><main><h1 id="h">Здесь будет твой сайт</h1><button id="out">Выйти</button></main>
<script>
let u='';try{u=localStorage.getItem('user')||''}catch(e){}
if(!u) location.replace('index.html');
document.getElementById('h').textContent='Привет, '+u+'! Здесь будет твой сайт';
document.getElementById('out').onclick=()=>{try{localStorage.removeItem('user')}catch(e){};location.href='index.html'};
</script></body></html>
