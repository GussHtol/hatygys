<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Высококачественное изображение гор на фоне с правильным масштабированием */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Затемнение фона для лучшей читаемости формы */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 400px;
            padding: 40px;
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .checkbox-group input {
            margin-right: 10px;
            accent-color: #fff;
            width: 16px;
            height: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #e0e0e0;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .register-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Кнопка включения/выключения звука (опционально, так как браузеры блокируют автоплей со звуком) */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 14px;
            transition: background 0.3s;
        }

        .sound-toggle:hover {
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Аудио элемент для звука ветра. 
         Положите файл со звуком (например, wind.mp3) в папку с проектом -->
    <audio id="windAudio" loop>
        <source src="wind.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио элемент.
    </audio>

    <!-- Кнопка управления звуком (нужна из-за политики безопасности браузеров, запрещающих автовоспроизведение звука без клика) -->
    <button class="sound-toggle" id="soundToggleBtn">🔊 Включить звук ветра</button>

    <div class="login-container">
        <h2>Вход</h2>
        <form>
            <div class="input-group">
                <input type="text" placeholder="Имя пользователя" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Пароль" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Запомнить меня</label>
            </div>
            <button type="submit" class="btn-submit">Войти</button>
            <div class="register-link">
                Нет аккаунта? <a href="#">Зарегистрироваться</a>
            </div>
        </form>
    </div>

    <script>
        const audio = document.getElementById('windAudio');
        const soundBtn = document.getElementById('soundToggleBtn');

        let isPlaying = false;

        soundBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    soundBtn.textContent = '🔇 Выключить звук';
                }).catch(e => {
                    console.log("Ошибка воспроизведения аудио:", e);
                });
            } else {
                audio.pause();
                isPlaying = false;
                soundBtn.textContent = '🔊 Включить звук ветра';
            }
        });
    </script>
</body>
</html>
