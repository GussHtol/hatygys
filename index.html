box-shadow:0 20px 60px rgba(0,0,0,.45)}
.title{font-family:'Marck Script',cursive;font-size:2.6rem;line-height:1.05;font-weight:400;color:#0b1511;text-shadow:0 1px 0 rgba(255,255,255,.25);flex:0 0 auto}
form{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
input[type=text],input[type=email],select{width:100%;padding:11px 12px;border:0;border-radius:7px;background:var(--field);color:var(--text);font:inherit;font-size:.9rem;outline:none}
input::placeholder{color:rgba(234,243,238,.6)}
input:focus-visible,select:focus-visible,button:focus-visible,.chip:has(input:focus-visible){outline:2px solid #bfe3d0;outline-offset:2px}
.genders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:9px;background:var(--chip);border:1px solid var(--glass-border);font-size:.8rem;transition:background .2s,border-color .2s}
.chip span b{font-size:1rem;font-weight:400}
.chip input:checked+span{background:rgba(190,230,210,.42);border-color:#d6f2e3}
.label{font-size:.85rem;font-weight:600;color:#0b1511;margin-top:2px}
button{margin-top:6px;padding:12px;border:0;border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#4d7363}
button:active{transform:scale(.98)}
.msg{font-size:.85rem;min-height:1.1em}
.msg.err{color:#ffb4a8}.msg.ok{color:#bff0d3}
@media(max-width:560px){.card{flex-direction:column;align-items:stretch;gap:16px;padding:24px 20px}.title{font-size:2.2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <h1 class="title">Регистра&shy;ция</h1>
  <form id="f" novalidate>
    <input type="text" id="name" placeholder="Имя и фамилия" autocomplete="name" required>
    <input type="email" id="email" placeholder="Электронная почта" autocomplete="email" required>
    <div class="genders" role="radiogroup" aria-label="Пол">
      <label class="chip"><input type="radio" name="gender" value="male"><span><b>♂</b>Мужской</span></label>
      <label class="chip"><input type="radio" name="gender" value="female"><span><b>♀</b>Женский</span></label>
      <label class="chip"><input type="radio" name="gender" value="other"><span><b>⚧</b>Другое</span></label>
    </div>
    <label class="label" for="role">Вы:</label>
    <select id="role">
      <option value="">Выберите</option>
      <option>Студент</option>
      <option>Разработчик</option>
      <option>Дизайнер</option>
      <option>Другое</option>
    </select>
    <button type="submit">Зарегистрироваться</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg');
f.addEventListener('submit',e=>{
  e.preventDefault();
  const name=f.name.value.trim(),email=f.email.value.trim();
  const gender=f.querySelector('input[name=gender]:checked'),role=f.role.value;
  msg.className='msg err';
  if(!name) return msg.textContent='Введите имя и фамилию.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg.textContent='Введите корректную почту.';
  if(!gender) return msg.textContent='Выберите пол.';
  if(!role) return msg.textContent='Выберите, кто вы.';
  const data={name,email,gender:gender.value,role};
  console.log('signup',data); // TODO: отправить на сервер через fetch
  msg.className='msg ok';msg.textContent='Готово, '+name.split(' ')[0]+'!';
  f.reset();
});
</script>
</body>
</html>
