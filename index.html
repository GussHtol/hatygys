.card{display:flex;align-items:center;gap:36px;padding:32px 34px;border-radius:18px;width:min(640px,100%);
background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
box-shadow:0 20px 60px rgba(0,0,0,.45)}
.title{font-family:'Marck Script',cursive;font-size:2.6rem;line-height:1.05;font-weight:400;color:#0b1511;text-shadow:0 1px 0 rgba(255,255,255,.25);flex:0 0 150px}
.panel{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid var(--glass-border);margin-bottom:4px}
.tab{padding:9px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;transition:background .2s}
.tab[aria-selected=true]{background:rgba(190,230,210,.42);font-weight:600}
form{display:flex;flex-direction:column;gap:10px}
input{width:100%;padding:11px 12px;border:0;border-radius:7px;background:var(--field);color:var(--text);font:inherit;font-size:.9rem;outline:none}
input::placeholder{color:rgba(234,243,238,.6)}
input:focus-visible,.tab:focus-visible,.submit:focus-visible{outline:2px solid #bfe3d0;outline-offset:2px}
.submit{margin-top:6px;padding:12px;border:0;border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
.submit:hover{background:#4d7363}
.submit:active{transform:scale(.98)}
.msg{font-size:.85rem;min-height:1.1em}
.msg.err{color:#ffb4a8}.msg.ok{color:#bff0d3}
[hidden]{display:none!important}
@media(max-width:560px){.card{flex-direction:column;align-items:stretch;gap:16px;padding:24px 20px}.title{font-size:2.2rem;flex:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <h1 class="title" id="title">Вход</h1>
  <div class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-login" aria-selected="true" type="button">Вход</button>
      <button class="tab" role="tab" id="tab-reg" aria-selected="false" type="button">Регистрация</button>
    </div>
    <form id="login" novalidate>
      <input type="text" name="login" placeholder="Логин" autocomplete="username">
      <input type="password" name="password" placeholder="Пароль" autocomplete="current-password">
      <button class="submit" type="submit">Войти</button>
    </form>
    <form id="reg" novalidate hidden>
      <input type="text" name="login" placeholder="Логин" autocomplete="username">
      <input type="password" name="password" placeholder="Пароль" autocomplete="new-password">
      <input type="password" name="password2" placeholder="Повторите пароль" autocomplete="new-password">
      <button class="submit" type="submit">Зарегистрироваться</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>
</main>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
const forms={login:$('login'),reg:$('reg')},tabs={login:$('tab-login'),reg:$('tab-reg')};
const titles={login:'Вход',reg:'Регистра\u00ADция'};
function show(mode){
  for(const k in forms){forms[k].hidden=k!==mode;tabs[k].setAttribute('aria-selected',k===mode)}
  $('title').textContent=titles[mode];msg.textContent='';
}
tabs.login.onclick=()=>show('login');
tabs.reg.onclick=()=>show('reg');
function fail(t){msg.className='msg err';msg.textContent=t}
function ok(t){msg.className='msg ok';msg.textContent=t}
forms.login.addEventListener('submit',e=>{
  e.preventDefault();
  const login=e.target.login.value.trim(),password=e.target.password.value;
  if(!login) return fail('Введите логин.');
  if(!password) return fail('Введите пароль.');
  console.log('login',{login}); // TODO: отправить на сервер через fetch
  ok('Добро пожаловать, '+login+'!');
});
forms.reg.addEventListener('submit',e=>{
  e.preventDefault();
  const login=e.target.login.value.trim(),p=e.target.password.value,p2=e.target.password2.value;
  if(login.length<3) return fail('Логин — минимум 3 символа.');
  if(p.length<6) return fail('Пароль — минимум 6 символов.');
  if(p!==p2) return fail('Пароли не совпадают.');
  console.log('register',{login}); // TODO: отправить на сервер через fetch
  ok('Аккаунт создан. Теперь войдите.');
  e.target.reset();show('login');ok('Аккаунт создан. Теперь войдите.');
});
</script>
</body>
</html>
