<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моё приложение</title>
<style>
:root{--ink:#fff;--glass:rgba(14,22,34,.55);--line:rgba(255,255,255,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Arial,Helvetica,sans-serif;color:var(--ink);
  display:grid;place-items:center;padding:16px;background-color:#1b2a26;
  background-image:
    linear-gradient(rgba(10,20,30,.12),rgba(10,20,30,.12)),
    url(bg.jpg),
    linear-gradient(#6b7d79 0%,#2c3d38 55%,#0e1815 100%);
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.card{
  width:min(380px,100%);padding:32px 28px 28px;
  border:1px solid var(--line);border-radius:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
h1{margin:0 0 26px;text-align:center;font-size:28px}
input[type=text],input[type=password]{
  width:100%;height:44px;margin-bottom:16px;padding:0 18px;
  border:1px solid var(--line);border-radius:22px;
  background:transparent;color:var(--ink);font-size:14px;
}
input::placeholder{color:rgba(255,255,255,.75)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin:2px 4px 16px;font-size:12px}
.main{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:44px;border:0;border-radius:22px;
  background:#fff;color:#111;font-size:14px;font-weight:700;
  text-decoration:none;cursor:pointer;
}
.msg{min-height:18px;margin:0 0 10px;text-align:center;font-size:13px;color:#ffc2b8}
.alt{margin:18px 0 0;text-align:center;font-size:14px}
.link{border:0;padding:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}
.home p{margin:0 0 22px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<main class="card">

  <section id="auth">
    <h1 id="title">Вход</h1>
    <form id="form" novalidate>
      <input id="user" type="text" placeholder="Имя пользователя" autocomplete="username" aria-label="Имя пользователя">
      <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль">
      <label class="row"><input id="remember" type="checkbox" checked> Запомнить меня</label>
      <p id="msg" class="msg" role="alert"></p>
      <button id="go" class="main" type="submit">Войти</button>
    </form>
    <p class="alt"><span id="sw-text">Нет аккаунта?</span> <button id="sw" class="link" type="button">Зарегистрироваться</button></p>
  </section>

  <section id="home" class="home" hidden>
    <h1>Привет, <span id="who"></span></h1>
    <p>Приложение готово к загрузке.</p>
    <a id="dl" class="main" href="#" download>Скачать приложение</a>
    <p class="alt"><button id="out" class="link" type="button">Выйти</button></p>
  </section>

</main>

<script>
// Вставьте сюда ссылку на файл приложения (например, из GitHub Releases)
const DOWNLOAD_URL = "#";

const $ = s => document.querySelector(s);
let mode = "login";

function getUsers(){ try{ return JSON.parse(localStorage.getItem("users") || "{}"); }catch(e){ return {}; } }
function saveUsers(u){ try{ localStorage.setItem("users", JSON.stringify(u)); return true; }catch(e){ return false; } }
function setSession(name, remember){ try{ (remember ? localStorage : sessionStorage).setItem("session", name); }catch(e){} }
function getSession(){ try{ return localStorage.getItem("session") || sessionStorage.getItem("session"); }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem("session"); sessionStorage.removeItem("session"); }catch(e){} }
function err(t){ $("#msg").textContent = t; }

async function hash(pw, salt){
  const bytes = new TextEncoder().encode(salt + pw);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// Звук ветра: шум, пропущенный через фильтр с медленными «порывами»
function playWind(ac){
  if(!ac) return;
  const sec = 5, rate = ac.sampleRate;
  const buf = ac.createBuffer(1, rate * sec, rate), d = buf.getChannelData(0);
  let last = 0;
  for(let i = 0; i < d.length; i++){
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = last * 3.5;
  }
  const src = ac.createBufferSource(); src.buffer = buf;
  const filt = ac.createBiquadFilter(); filt.type = "bandpass"; filt.Q.value = 0.8; filt.frequency.value = 500;
  const gain = ac.createGain(), t = ac.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.5, t + 1.5);
  gain.gain.linearRampToValueAtTime(0, t + sec);
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.35;
  const lfoGain = ac.createGain(); lfoGain.gain.value = 250;
  lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  src.start(); lfo.start(); lfo.stop(t + sec);
  src.onended = () => ac.close();
}

function render(){
  const user = getSession();
  $("#auth").hidden = !!user;
  $("#home").hidden = !user;
  $("#dl").href = DOWNLOAD_URL;
  if(user){ $("#who").textContent = user; return; }
  const reg = mode === "register";
  $("#title").textContent = reg ? "Регистрация" : "Вход";
  $("#go").textContent = reg ? "Создать аккаунт" : "Войти";
  $("#sw-text").textContent = reg ? "Уже есть аккаунт?" : "Нет аккаунта?";
  $("#sw").textContent = reg ? "Войти" : "Зарегистрироваться";
  $("#pw").autocomplete = reg ? "new-password" : "current-password";
  err("");
}

$("#sw").addEventListener("click", () => { mode = mode === "login" ? "register" : "login"; render(); });

$("#out").addEventListener("click", () => { clearSession(); $("#pw").value = ""; render(); });

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#user").value.trim(), pw = $("#pw").value, remember = $("#remember").checked;
  if(name.length < 3) return err("Имя должно быть не короче 3 символов.");
  if(pw.length < 6) return err("Пароль должен быть не короче 6 символов.");

  const users = getUsers(), key = name.toLowerCase();
  let shown = name;

  if(mode === "register"){
    // AudioContext создаём сразу по клику, иначе браузер может заблокировать звук
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = AC ? new AC() : null;
    if(ac) ac.resume();
    if(users[key]) { if(ac) ac.close(); return err("Это имя уже занято. Выберите другое."); }
    const salt = crypto.getRandomValues(new Uint32Array(4)).join("-");
    users[key] = { name, salt, hash: await hash(pw, salt) };
    if(!saveUsers(users)) { if(ac) ac.close(); return err("Браузер не дал сохранить аккаунт. Выключите приватный режим."); }
    playWind(ac);
  } else {
    const u = users[key];
    if(!u || u.hash !== await hash(pw, u.salt)) return err("Неверное имя или пароль.");
    shown = u.name;
  }

  setSession(shown, remember);
  $("#pw").value = "";
  render();
});

render();
</script>
</body>
</html>
