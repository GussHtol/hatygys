.wrap{min-height:100vh;padding:5vh 4vw;display:flex;align-items:stretch}
.panel{width:min(440px,100%);min-height:90vh;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:28px 40px;
background:var(--panel);border:1px solid rgba(40,80,100,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{text-align:center;font-size:1.6rem;font-weight:600;margin-bottom:10px}
form{display:flex;flex-direction:column}
label.f{font-size:.95rem;margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;height:38px;padding:0 10px;border:1px solid rgba(40,80,100,.5);border-radius:3px;background:#fff;color:#111;font:inherit;font-size:.95rem;outline:none}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.remember{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.78rem;cursor:pointer}
.remember input{width:14px;height:14px}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.main{min-width:130px;padding:11px 28px;border:0;border-radius:12px;background:var(--btn);color:var(--text);font:inherit;font-size:1rem;font-weight:500;cursor:pointer;transition:background .2s,transform .1s}
.main:hover{background:var(--btn-hover)}
.main:active{transform:scale(.98)}
.link{background:none;border:0;color:var(--text);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.alt{width:140px;padding:6px;border:1px solid rgba(40,80,100,.5);border-radius:3px;background:rgba(200,225,235,.7);color:var(--text);font:inherit;font-size:.8rem;cursor:pointer;transition:background .2s}
.alt:hover{background:rgba(225,240,245,.9)}
.msg{min-height:1.2em;margin-top:14px;text-align:center;font-size:.85rem;font-weight:500}
.msg.err{color:#7a1405}.msg.ok{color:#0b4a2a}
[hidden]{display:none!important}
@media(max-width:560px){.wrap{padding:0}.panel{width:100%;min-height:100vh;padding:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <h1 id="title">Вход</h1>

    <form id="login" novalidate>
      <label class="f" for="l-login">Логин</label>
      <input type="text" id="l-login" name="login" autocomplete="username">
      <label class="f" for="l-pass">Пароль</label>
      <input type="password" id="l-pass" name="password" autocomplete="current-password">
      <label class="remember"><input type="checkbox" name="remember"> Запомнить меня</label>
      <div class="actions">
        <button class="main" type="submit">Войти</button>
        <button class="link" type="button" id="forgot">Забыли пароль?</button>
        <button class="alt" type="button" id="to-reg">Зарегистрироваться</button>
      </div>
    </form>

    <form id="reg" novalidate hidden>
      <label class="f" for="r-login">Логин</label>
      <input type="text" id="r-login" name="login" autocomplete="username">
      <label class="f" for="r-pass">Пароль</label>
      <input type="password" id="r-pass" name="password" autocomplete="new-password">
      <label class="f" for="r-pass2">Повторите пароль</label>
      <input type="password" id="r-pass2" name="password2" autocomplete="new-password">
      <div class="actions">
        <button class="main" type="submit">Зарегистрироваться</button>
        <button class="alt" type="button" id="to-login">Уже есть аккаунт</button>
      </div>
    </form>

    <p class="msg" id="msg" role="status"></p>
  </main>
</div>
<script>
// Сюда впиши адрес сайта, куда перекидывать после входа/регистрации
const REDIRECT_URL='main.html';
function goNext(login){
  try{localStorage.setItem('user',login)}catch(e){}
  location.href=REDIRECT_URL;
}
const $=id=>document.getElementById(id),msg=$('msg');
const fail=t=>{msg.className='msg err';msg.textContent=t};
const ok=t=>{msg.className='msg ok';msg.textContent=t};
function show(mode){
  const reg=mode==='reg';
  $('login').hidden=reg;$('reg').hidden=!reg;
  $('title').textContent=reg?'Регистрация':'Вход';
  msg.textContent='';
}
$('to-reg').onclick=()=>show('reg');
$('to-login').onclick=()=>show('login');
$('forgot').onclick=()=>{ /* TODO: восстановление пароля */ fail('Восстановление пароля пока не подключено.') };

$('login').addEventListener('submit',e=>{
  e.preventDefault();
  const login=e.target.login.value.trim(),password=e.target.password.value;
  if(!login) return fail('Введите логин.');
  if(!password) return fail('Введите пароль.');
  console.log('login',{login,remember:e.target.remember.checked}); // TODO: fetch на сервер
  goNext(login);
});
$('reg').addEventListener('submit',e=>{
  e.preventDefault();
  const login=e.target.login.value.trim(),p=e.target.password.value,p2=e.target.password2.value;
  if(login.length<3) return fail('Логин — минимум 3 символа.');
  if(p.length<6) return fail('Пароль — минимум 6 символов.');
  if(p!==p2) return fail('Пароли не совпадают.');
  console.log('register',{login}); // TODO: fetch на сервер
  goNext(login);
});
</script>
</body>
</html>
